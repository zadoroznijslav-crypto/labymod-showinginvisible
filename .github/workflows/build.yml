name: Build LabyMod Addon

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Pack Addon
      run: |
        mkdir -p build/libs/out
        cp -r src/main/resources/* build/libs/out/ 2>/dev/null || true
        mkdir -p build/libs/out/net/labymod/addons/showinginvisible
        cp src/main/java/net/labymod/addons/showinginvisible/ShowingInvisibleAddon.java build/libs/out/net/labymod/addons/showinginvisible/
        cd build/libs/out
        zip -r ../ShowingInvisiblePlayers-LabyMod3.jar .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShowingInvisiblePlayers-LabyMod3
        path: build/libs/*.jar
